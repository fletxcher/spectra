[project]
name = "spectra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fletxcher", email = "fletxcher@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cantera>=3.2.0",
    "indsl[numba]>=8.9.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0.0,<2.5",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.0,<1.18.0",
]

[project.scripts]
spectra = "src:main"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
